services:

  # ── Base de datos ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lorers_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lorers_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lorers_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Express + TypeScript) ─────────────────────────────────────────
  backend:
    build:
      context: ./lorers_back
      dockerfile: Dockerfile
    container_name: lorers_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_NAME: lorers_db
      DB_USER: admin
      DB_PASSWORD: "1234"
      JWT_SECRET: 877309d7-e9e7-4a16-8102-a824783465f6
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Angular + Nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./lorers_front
      dockerfile: Dockerfile
    container_name: lorers_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
