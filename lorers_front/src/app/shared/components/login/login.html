<div class="page-wrapper">
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-grid"></div>

  <div class="page-container">

    <!-- Header -->
    <header class="page-header">
      <div class="header-brand">
        <span class="brand-mark">◈</span>
      </div>
      <div class="header-title">
        <span class="header-tag">BIENVENIDO DE VUELTA</span>
        <h1>Inicia<br><em>sesión</em></h1>
      </div>
    </header>

    <!-- Divider -->
    <div class="header-divider"></div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="login-form">

      <!-- General error alert -->
      <div class="alert-error" *ngIf="authError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ authError }}
      </div>

      <!-- Username -->
      <div class="field-group">
        <label class="field-label" for="username">Usuario</label>
        <div class="field-wrap field-wrap--icon" [class.field-wrap--error]="hasError('username')">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            id="username"
            class="field-input"
            type="text"
            formControlName="username"
            placeholder="Tu nombre de usuario"
            autocomplete="username"
            spellcheck="false"
          />
        </div>
        <span class="field-error" *ngIf="hasError('username')">
          El usuario es obligatorio
        </span>
      </div>

      <!-- Password -->
      <div class="field-group">
        <div class="field-label-row">
          <label class="field-label" for="password">Contraseña</label>
          <a class="forgot-link" routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="field-wrap field-wrap--icon field-wrap--icon-right" [class.field-wrap--error]="hasError('password')">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input
            id="password"
            class="field-input"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <!-- Eye open -->
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye closed -->
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-error" *ngIf="hasError('password')">
          La contraseña es obligatoria
        </span>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn-submit"
        [class.btn-submit--loading]="isLoading"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Entrar
        </span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <!-- Register link -->
      <p class="register-hint">
        ¿No tienes cuenta?
        <a class="register-link" routerLink="/register">Regístrate aquí</a>
      </p>

    </form>

  </div>
</div>
