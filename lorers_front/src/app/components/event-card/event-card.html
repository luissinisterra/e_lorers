<article class="event-card" (click)="onClick()">

  <!-- Band: estado + capacidad -->
  <div class="card-band">
    <span class="event-badge" [ngClass]="statusClass">{{ statusLabel }}</span>
    @if (event.max_participants) {
      <span class="cap-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
        </svg>
        {{ event.max_participants }}
      </span>
    }
  </div>

  <!-- Cuerpo -->
  <div class="card-body">
    <h3 class="card-title">{{ event.name }}</h3>

    @if (event.description) {
      <p class="card-desc">{{ shortDescription }}</p>
    }

    <div class="card-meta">
      <div class="meta-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>{{ dateRange }}</span>
      </div>
      <div class="meta-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span>{{ event.address }}</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="card-footer">
    <span class="card-id">#{{ event.id_event }}</span>
    <span class="card-link">
      Ver detalle
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </span>
  </div>

</article>
